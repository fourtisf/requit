# Nginx for requit.xyz — reverse proxy in front of `next start` on :3000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/requit
#   sudo ln -sf /etc/nginx/sites-available/requit /etc/nginx/sites-enabled/requit
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is issued by certbot, which rewrites the listen lines below:
#   sudo certbot --nginx -d requit.xyz -d www.requit.xyz

upstream requit_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect the www CNAME to the apex, so a session cookie set on one host is
# never invisible on the other.
server {
    listen 80;
    listen [::]:80;
    server_name www.requit.xyz;
    return 308 https://requit.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name requit.xyz;

    # Evidence uploads for disputes (Phase 3). Everything else is tiny.
    client_max_body_size 12m;

    # ── Client IP ────────────────────────────────────────────────────────────
    # src/lib/request-ip.ts reads cf-connecting-ip, true-client-ip, x-real-ip,
    # then the first hop of x-forwarded-for. X-Real-IP below is what makes rate
    # limiting work today. It MUST be set by us and never passed through from
    # the client, or anyone can forge their own rate-limit bucket.
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host             $host;

    # ── Country ──────────────────────────────────────────────────────────────
    # src/lib/country.ts reads cf-ipcountry. Nginx cannot produce it, so until
    # DNS moves to Cloudflare EVERY signup records country XX and no offer can
    # be matched. See deploy/README.md — this is not cosmetic.
    #
    # Once Cloudflare is in front, uncomment the real-IP block below so
    # $remote_addr is the visitor rather than Cloudflare's edge:
    #
    #   include /etc/nginx/cloudflare-ips.conf;   # set_real_ip_from ranges
    #   real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://requit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # Content-hashed bundles. Safe to cache hard and never revalidate.
    location /_next/static/ {
        proxy_pass http://requit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache anything under /api — postbacks, sessions, the CSV statement.
    location /api/ {
        proxy_pass http://requit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Offer networks post here and retry on any non-200 (§4.2). Give it a longer
    # read timeout than the rest: a slow database write must not become a
    # timeout the network reads as failure and retries forever.
    location /api/postback/ {
        proxy_pass http://requit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
        access_log /var/log/nginx/requit-postback.log;
    }

    # Unauthenticated by design, so keep it off the main access log.
    location = /api/health {
        proxy_pass http://requit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
