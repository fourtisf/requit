<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box} body{background:#111}
  .tile{width:1000px;height:1000px;display:grid;place-items:center;overflow:hidden}
</style></head><body><div class="tile" id="plate" style="background:#0C0D0F;
     background-image:radial-gradient(58% 46% at 50% 34%,rgba(107,203,165,.16),transparent 68%);"><svg viewBox="0 0 32 32" width="52%" height="52%" style="display:block">
      <g transform="translate(-0.5 0)">
        <path d="M7.5 7.5 16 16 7.5 24.5Z" fill="#FBFBFA"/>
        <path d="M17 7.5 25.5 16 17 24.5Z" fill="#6BCBA5"/>
      </g>
    </svg></div><div class="tile" id="mint" style="background:linear-gradient(148deg,#FFFFFF 0%,#A9E7CD 56%,#3E9878 100%);"><svg viewBox="0 0 32 32" width="50%" height="50%" style="display:block">
      <g transform="translate(-0.5 0)">
        <path d="M7.5 7.5 16 16 7.5 24.5Z" fill="#08090A"/>
        <path d="M17 7.5 25.5 16 17 24.5Z" fill="#0C4F3A"/>
      </g>
    </svg></div><div class="tile" id="light" style="background:#F4F5F3;"><svg viewBox="0 0 32 32" width="50%" height="50%" style="display:block">
      <g transform="translate(-0.5 0)">
        <path d="M7.5 7.5 16 16 7.5 24.5Z" fill="#14171A"/>
        <path d="M17 7.5 25.5 16 17 24.5Z" fill="#2F8A69"/>
      </g>
    </svg></div><div class="tile" id="ring" style="background:#0C0D0F;
     background-image:radial-gradient(58% 46% at 50% 34%,rgba(107,203,165,.14),transparent 68%);
     box-shadow:inset 0 0 0 22px rgba(107,203,165,.34);"><svg viewBox="0 0 32 32" width="46%" height="46%" style="display:block">
      <g transform="translate(-0.5 0)">
        <path d="M7.5 7.5 16 16 7.5 24.5Z" fill="#FBFBFA"/>
        <path d="M17 7.5 25.5 16 17 24.5Z" fill="#6BCBA5"/>
      </g>
    </svg></div><div class="tile" id="bleed" style="background:#08090A;"><svg viewBox="0 0 32 32" width="78%" height="78%" style="display:block">
      <g transform="translate(-0.5 0)">
        <path d="M7.5 7.5 16 16 7.5 24.5Z" fill="#FBFBFA"/>
        <path d="M17 7.5 25.5 16 17 24.5Z" fill="#6BCBA5"/>
      </g>
    </svg></div></body></html>
