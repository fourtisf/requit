*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.frame{
  width:1600px;height:900px;position:relative;overflow:hidden;

  background:#08090A;
}
/* One light source, upper left, exactly as the logo assumes. */
.glow{position:absolute;inset:0;pointer-events:none}
.mono{font-family:GM,ui-monospace,monospace}

.g1{background:
  radial-gradient(900px 560px at 12% 4%, rgba(255,255,255,.08), transparent 60%),
  radial-gradient(720px 620px at 82% 54%, rgba(107,203,165,.20), transparent 64%),
  radial-gradient(500px 400px at 96% 92%, rgba(107,203,165,.09), transparent 70%);}
.hair{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10) 22%,rgba(255,255,255,.10) 78%,transparent)}
.pad{position:absolute;inset:0;padding:76px 92px;display:flex;flex-direction:column}
.lock{display:flex;align-items:center;gap:17px}
.name{font-size:38px;font-weight:600;letter-spacing:-.035em}
.body{flex:1;display:grid;grid-template-columns:1fr 300px;align-items:center;gap:48px}
.chip{display:inline-flex;align-items:center;gap:13px;align-self:flex-start;
  background:rgba(107,203,165,.10);padding:10px 20px 10px 11px;border-radius:999px;
  box-shadow:inset 0 0 0 1px rgba(107,203,165,.26);font-size:20px;color:#9C9E9C}
.chip b{background:rgba(107,203,165,.18);color:#95E0C1;font-weight:600;
  font-size:17px;padding:5px 13px;border-radius:999px}
h1{font-size:86px;white-space:nowrap;line-height:.99;letter-spacing:-.045em;font-weight:600;margin-top:30px}
h1 .dim{color:#6A6D6B}
.sub{font-size:24px;font-weight:300;line-height:1.55;color:#9C9E9C;max-width:44ch;margin-top:28px}
/* The mark carries the right half. At a timeline thumbnail the headline is the
   only text that survives, so the shape has to do the recognising. */
.hero{display:grid;place-items:center}
.foot{display:flex;align-items:center;justify-content:space-between;gap:40px;
  padding-top:34px;border-top:1px solid rgba(255,255,255,.07)}
.url{font-size:31px;letter-spacing:-.01em;color:#FBFBFA}
.rails{display:flex;gap:10px}
.rail{font-size:19px;color:#6A6D6B;background:rgba(255,255,255,.026);
  padding:9px 17px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.065)}
