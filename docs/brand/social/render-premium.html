<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box} body{background:#111}
  .tile{width:1000px;height:1000px;display:grid;place-items:center;overflow:hidden;border-radius:50%}
  .art{width:56%;height:56%;display:grid;place-items:center}
</style></head><body><div class="tile" id="lumen" style="background:radial-gradient(76% 62% at 50% 18%,#191C1F 0%,#0B0C0E 62%,#08090A 100%);
     box-shadow:inset 0 14px 46px rgba(255,255,255,.055), inset 0 -22px 60px rgba(0,0,0,.6);"><div class="art"><svg viewBox="0 0 32 32" width="100%" height="100%" style="display:block;overflow:visible">
      <defs><linearGradient id="aL" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F1F3F1"/><stop offset="1" stop-color="#BFC4C1"/></linearGradient><linearGradient id="bL" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#C9F3E1"/><stop offset="0.5" stop-color="#8CDCBB"/><stop offset="1" stop-color="#3E9878"/></linearGradient></defs>
      <g transform="translate(-0.4 0)" style="filter:drop-shadow(0 10px 26px rgba(107,203,165,.30)) drop-shadow(0 2px 4px rgba(0,0,0,.55))">
        <path d="M6.8 8.4 14.4 16 6.8 23.6Z" fill="url(#aL)"
              stroke="url(#aL)" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M17.6 8.4 25.2 16 17.6 23.6Z" fill="url(#bL)"
              stroke="url(#bL)" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg></div></div><div class="tile" id="aurora" style="background:#08090A;
     background-image:radial-gradient(52% 42% at 54% 44%,rgba(107,203,165,.42) 0%,rgba(107,203,165,.10) 45%,transparent 72%),
                      radial-gradient(80% 60% at 50% 12%,rgba(255,255,255,.07),transparent 60%);"><div class="art"><svg viewBox="0 0 32 32" width="100%" height="100%" style="display:block;overflow:visible">
      <defs><linearGradient id="aA" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D7DBD8"/></linearGradient><linearGradient id="bA" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#EAFBF3"/><stop offset="1" stop-color="#7ED2AF"/></linearGradient></defs>
      <g transform="translate(-0.4 0)" style="filter:drop-shadow(0 6px 20px rgba(0,0,0,.55))">
        <path d="M6.8 8.4 14.4 16 6.8 23.6Z" fill="url(#aA)"
              stroke="url(#aA)" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M17.6 8.4 25.2 16 17.6 23.6Z" fill="url(#bA)"
              stroke="url(#bA)" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg></div></div><div class="tile" id="steel" style="background:linear-gradient(180deg,#131518 0%,#0A0B0D 58%,#08090A 100%);
     box-shadow:inset 0 12px 40px rgba(255,255,255,.05), inset 0 -20px 50px rgba(0,0,0,.55);"><div class="art"><svg viewBox="0 0 32 32" width="100%" height="100%" style="display:block;overflow:visible">
      <defs><linearGradient id="aS" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.48" stop-color="#E4E7E5"/><stop offset="1" stop-color="#9AA09C"/></linearGradient><linearGradient id="bS" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#C6CBC8"/><stop offset="0.5" stop-color="#8E948F"/><stop offset="1" stop-color="#5A605C"/></linearGradient></defs>
      <g transform="translate(-0.4 0)" style="filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))">
        <path d="M6.8 8.4 14.4 16 6.8 23.6Z" fill="url(#aS)"
              stroke="url(#aS)" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M17.6 8.4 25.2 16 17.6 23.6Z" fill="url(#bS)"
              stroke="url(#bS)" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg></div></div><div class="tile" id="emboss" style="background:linear-gradient(168deg,#15181B 0%,#0C0E10 55%,#07080A 100%);
     box-shadow:inset 0 16px 44px rgba(255,255,255,.06), inset 0 -26px 64px rgba(0,0,0,.66);"><div class="art"><svg viewBox="0 0 32 32" width="100%" height="100%" style="display:block;overflow:visible">
      <defs><linearGradient id="aE" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#EFF2F0"/><stop offset="1" stop-color="#A8AEAA"/></linearGradient><linearGradient id="bE" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#B9EED8"/><stop offset="0.42" stop-color="#78CFAA"/><stop offset="1" stop-color="#2F7C60"/></linearGradient></defs>
      <g transform="translate(-0.4 0)" style="filter:drop-shadow(0 1px 0 rgba(255,255,255,.30)) drop-shadow(0 -1px 0 rgba(0,0,0,.7)) drop-shadow(0 12px 26px rgba(0,0,0,.62))">
        <path d="M6.8 8.4 14.4 16 6.8 23.6Z" fill="url(#aE)"
              stroke="url(#aE)" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M17.6 8.4 25.2 16 17.6 23.6Z" fill="url(#bE)"
              stroke="url(#bE)" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg></div></div><div class="tile" id="jade" style="background:radial-gradient(72% 58% at 50% 20%,#14171A 0%,#0A0B0D 64%,#08090A 100%);
     box-shadow:inset 0 14px 42px rgba(255,255,255,.05), inset 0 -22px 56px rgba(0,0,0,.6);"><div class="art"><svg viewBox="0 0 32 32" width="100%" height="100%" style="display:block;overflow:visible">
      <defs><linearGradient id="aJ" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#EDFCF5"/><stop offset="0.5" stop-color="#B4E9D1"/><stop offset="1" stop-color="#6FBE9C"/></linearGradient><linearGradient id="bJ" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#8FDCBB"/><stop offset="0.5" stop-color="#55B08C"/><stop offset="1" stop-color="#2A7259"/></linearGradient></defs>
      <g transform="translate(-0.4 0)" style="filter:drop-shadow(0 10px 28px rgba(107,203,165,.34)) drop-shadow(0 2px 5px rgba(0,0,0,.5))">
        <path d="M6.8 8.4 14.4 16 6.8 23.6Z" fill="url(#aJ)"
              stroke="url(#aJ)" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M17.6 8.4 25.2 16 17.6 23.6Z" fill="url(#bJ)"
              stroke="url(#bJ)" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg></div></div></body></html>
